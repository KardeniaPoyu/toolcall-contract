[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-contract"
version = "0.1.0"
description = "Executable tool-call contracts for streaming models, SDKs and gateways"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Toolcall Contract contributors"}]
keywords = ["llm", "tool-calling", "conformance", "streaming", "ci"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
dependencies = []

[project.urls]
Homepage = "https://github.com/KardeniaPoyu/toolcall-contract"
Repository = "https://github.com/KardeniaPoyu/toolcall-contract"
Issues = "https://github.com/KardeniaPoyu/toolcall-contract/issues"
Documentation = "https://github.com/KardeniaPoyu/toolcall-contract/tree/main/docs"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
sdk = ["openai>=1.68,<3", "anthropic>=0.49,<1"]

[project.scripts]
tcc = "toolcall_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tooling", ".smoke", "pytest-of-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
