name: Contract suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints/sdk-tested.txt ".[test,sdk]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --junitxml=reports/unit.xml
      - run: tcc demo --report-dir reports/demo
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/
            dist/
